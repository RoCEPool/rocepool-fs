name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # on main: also (re)runs the release job, e.g. to finish a backfill

jobs:
  build:
    # both transport backends against real headers, -Werror
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y gcc make cmake pkg-config libibverbs-dev librdmacm-dev
      - name: verbs backend
        run: ROCE_BACKEND=verbs bash roce/native/build.sh
      - name: ofi backend (libfabric from deps/)
        run: ROCE_BACKEND=ofi bash roce/native/build.sh

  test:
    # the whole suite on the software RDMA emulator: servers, clients, FUSE,
    # interception library, multi-node clusters in network namespaces (root)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake pkg-config autoconf automake libtool fuse3 iproute2 \
            libibverbs-dev librdmacm-dev
          sudo modprobe fuse || true
      - name: tests
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" python3 -m unittest discover -s tests -t . 2>&1 | tee unittest.log
      - name: summary
        if: always()
        run: |
          # the result line as an annotation (readable through the API without the raw log)
          r=$(grep -E '^Ran [0-9]+ tests' unittest.log | tail -1); v=$(grep -E '^(OK|FAILED)' unittest.log | tail -1)
          echo "::notice title=tests::$r -- $v"
          echo "$r -- $v" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAIL|ERROR):' unittest.log | head -20 | sed 's/^/::error title=test::/' || true

  tier-commit:
    # what a durable OST's commit costs under ior-hard-write's shape, on XFS
    # (the tier's file system on the AWS hosts) and ext4, each write synced
    # before its reply and (ROCEPOOL_OST_ASYNC=1) durable at the fsync:
    # tools/hard_write_bench.py
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake pkg-config autoconf automake libtool fuse3 iproute2 \
            libibverbs-dev librdmacm-dev xfsprogs e2fsprogs
          sudo modprobe fuse || true
          sudo modprobe xfs || true
      - name: ior-hard-write shape, durable OSTs -- XFS and ext4 on a RAM-backed loop device
        # in RAM a flush costs nothing, so a commit's time is the file system's
        # own work (journal, extent conversions) -- on the runner's disk the
        # flush (3.7 ms) hid everything else (first run of this job)
        run: |
          set -o pipefail
          sudo mount -o remount,size=12G /dev/shm
          for fs in xfs ext4 xfs; do
            sudo truncate -s 9G /dev/shm/$fs.img
            sudo mkfs.$fs -q /dev/shm/$fs.img
            sudo mkdir -p /mnt/t_$fs
            sudo mount -o loop /dev/shm/$fs.img /mnt/t_$fs
            sudo -E env "PATH=$PATH" python3 tools/hard_write_bench.py --dir /mnt/t_$fs/bench --seconds 30 \
              --writers 16 --tier-gib 3 --ram-cache-mib 64 --sets "synced:;ost-async:ROCEPOOL_OST_ASYNC=1" \
              2>&1 | tee -a bench.log
            sudo umount /mnt/t_$fs
            sudo rm -f /dev/shm/$fs.img
          done
      - name: summary
        if: always()
        run: grep -E '^== ' bench.log | cut -c1-900 | sed 's/^== /::notice title=tier commit::/' || true

  ofi-lanes:
    # a server endpoint's thread with payload pulls and large replies in
    # flight against waiting for each (tools/ofi_lane_bench.py), with a
    # delay on the link so that transfers take wire time as on EFA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake pkg-config autoconf automake libtool fuse3 iproute2 \
            libibverbs-dev librdmacm-dev
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe sch_netem || true
      - name: 1 MiB writes and reads, no delay / 0.5 ms / 2 ms
        run: |
          set -o pipefail
          for d in "" 500us 2ms; do
            sudo -E env "PATH=$PATH" python3 tools/ofi_lane_bench.py ${d:+--delay $d} --procs 8 --clients 4 --objects 24 --eps 2 \
              --rounds 2 2>&1 | tee -a lanes.log
          done
      - name: summary
        if: always()
        run: grep -E '^== ' lanes.log | cut -c1-900 | sed 's/^== /::notice title=ofi lanes::/' || true

  rocepond:
    # rocepond's schedulers with the real packages (Ray, DuckDB): the tests on
    # a local Ray, then the sort -- thousands of tasks -- on a simulated
    # 2-node rocepool cluster, once per scheduler (a 2-node Ray cluster for Ray)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake pkg-config autoconf automake libtool fuse3 iproute2 \
            libibverbs-dev librdmacm-dev python3-venv
          sudo modprobe fuse || true
          # a virtual environment: the system's Python packages are apt's to manage
          python3 -m venv "$HOME/rp"
          "$HOME/rp/bin/pip" install --quiet duckdb ray
          echo "RP_PY=$HOME/rp/bin/python3" >> "$GITHUB_ENV"
      - name: tests (ProcessExecutor and RayExecutor)
        timeout-minutes: 20
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "$RP_PY" -m unittest -v tests.test_rocepond 2>&1 | tee rocepond.log
      - name: sort on rocepool, ProcessExecutor (2048 partitions)
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "$RP_PY" tools/rocepond_sort.py --gib 0.25 --partitions 2048 --slots 2 \
            --report sort_process.json 2>&1 | tee sort_process.log
      - name: sort on rocepool, RayExecutor on a 2-node Ray cluster (2048 partitions)
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "$RP_PY" tools/rocepond_sort.py --gib 0.25 --partitions 2048 --slots 2 \
            --executor ray --report sort_ray.json 2>&1 | tee sort_ray.log
      - name: summary
        if: always()
        run: |
          # result lines as annotations (readable through the API without the raw log)
          r=$(grep -E '^Ran [0-9]+ tests' rocepond.log | tail -1); v=$(grep -E '^(OK|FAILED)' rocepond.log | tail -1)
          echo "::notice title=rocepond tests::$r -- $v"
          grep -E 'tasks/s on' rocepond.log | sed 's/^ */::notice title=scheduler::/' || true
          grep -E '^(FAIL|ERROR):' rocepond.log | head -20 | sed 's/^/::error title=test::/' || true
          grep -E '^(\w+Error|AssertionError)' rocepond.log | head -10 | sed 's/^/::error title=test detail::/' || true
          for k in process ray; do
            [ -f sort_$k.log ] || continue
            grep -E '^== (validation|shuffle \+ sort|Ray up|scheduler|ERROR)' sort_$k.log | cut -c1-900 \
              | sed "s/^/::notice title=sort ($k)::/" || true
            grep -E 'partition_sql -> sort_output' sort_$k.log | sed "s/^ */::notice title=sort ($k) tasks::/" || true
          done

  image:
    # the container image builds, and its emulator self-test passes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: docker build -t rocepool:ci .
      - name: self-test inside the image (RDMA emulator)
        run: docker run --rm rocepool:ci python3 -m unittest tests.test_kv_api tests.test_kv_gpu.KVGpuTests

  release:
    # every version that reaches main and passes build + test + image becomes
    # a GitHub Release (tag v<VERSION>) with the offline package attached --
    # notes from CHANGELOG.md -- and a container image
    # ghcr.io/<owner>/<repo>:<VERSION> (+ :latest).
    needs: [build, test, image]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: release v<VERSION> if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \n' < VERSION)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v already released"
          else
            bash tools/package.sh "$RUNNER_TEMP/rocepool-full-$v.tar.gz"
            python3 tools/release_notes.py "$v" --sha "$GITHUB_SHA" > notes.md
            gh release create "v$v" "$RUNNER_TEMP/rocepool-full-$v.tar.gz" --target "$GITHUB_SHA" \
              --title "rocepool $v" --notes-file notes.md --latest
          fi
      - name: container image ghcr.io/<owner>/<repo>:<VERSION>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \n' < VERSION)
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$img:$v" >/dev/null 2>&1; then echo "$img:$v already published"; exit 0; fi
          docker build -t "$img:$v" -t "$img:latest" .
          docker push "$img:$v"
          docker push "$img:latest"
      - name: is the image public?
        run: |
          v=$(tr -d ' \n' < VERSION)
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker manifest inspect "$img:$v" >/dev/null 2>&1; then
            echo "::notice title=container image::$img:$v can be pulled anonymously"
          else
            echo "::warning title=container image::$img is not public: the owner sets it once in the package's settings (Danger Zone > Change visibility > Public)"
          fi
      - name: release notes up to date with CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every release's notes are its CHANGELOG.md section: refreshed when
          # the changelog changes. (Versions older than this repository have no
          # release: GitHub does not let a workflow tag commits whose workflow
          # files differ from main's. CHANGELOG.md links each to its commit
          # and source archive instead.)
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          git log --format=%H -- VERSION | while read -r c; do
            v=$(git show "$c:VERSION" | tr -d ' \n')
            gh release view "v$v" >/dev/null 2>&1 || continue
            sha=$(git rev-list -n 1 "v$v" 2>/dev/null || echo "$c")
            noimg=--no-image
            docker manifest inspect "$img:$v" >/dev/null 2>&1 && noimg=
            python3 tools/release_notes.py "$v" --sha "$sha" $noimg > "notes-$v.md"
            gh release view "v$v" --json body -q .body > "old-$v.md"
            if ! diff -q <(sed -e '$a\' "old-$v.md") "notes-$v.md" >/dev/null; then
              gh release edit "v$v" --notes-file "notes-$v.md"
              echo "v$v: notes refreshed"
            fi
          done
