name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # both transport backends against real headers, -Werror
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y gcc make cmake pkg-config libibverbs-dev librdmacm-dev
      - name: verbs backend
        run: ROCE_BACKEND=verbs bash roce/native/build.sh
      - name: ofi backend (libfabric from deps/)
        run: ROCE_BACKEND=ofi bash roce/native/build.sh

  test:
    # the whole suite on the software RDMA emulator: servers, clients, FUSE,
    # interception library, multi-node clusters in network namespaces (root)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake pkg-config autoconf automake libtool fuse3 iproute2 \
            libibverbs-dev librdmacm-dev
          sudo modprobe fuse || true
      - name: tests
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" python3 -m unittest discover -s tests -t . 2>&1 | tee unittest.log
      - name: summary
        if: always()
        run: |
          # the result line as an annotation (readable through the API without the raw log)
          r=$(grep -E '^Ran [0-9]+ tests' unittest.log | tail -1); v=$(grep -E '^(OK|FAILED)' unittest.log | tail -1)
          echo "::notice title=tests::$r -- $v"
          echo "$r -- $v" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAIL|ERROR):' unittest.log | head -20 | sed 's/^/::error title=test::/' || true

  release:
    # every version that reaches main and passes build + test becomes a
    # GitHub Release (tag v<VERSION>), with the offline package attached
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: release v<VERSION> if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \n' < VERSION)
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already released"; exit 0; fi
          bash tools/package.sh "$RUNNER_TEMP/rocepool-full-$v.tar.gz"
          {
            echo "rocepool $v -- built from $GITHUB_SHA after build and test passed."
            echo
            echo 'Offline package: `rocepool-full-'"$v"'.tar.gz` (all third-party sources in `deps/`).'
            echo 'On a node: `tar xzf rocepool-full-'"$v"'.tar.gz && cd rocepool && cp cluster.conf.example cluster.conf && sudo ./run.sh`'
          } > notes.md
          gh release create "v$v" "$RUNNER_TEMP/rocepool-full-$v.tar.gz" --target "$GITHUB_SHA" --title "rocepool $v" --notes-file notes.md
