name: aws-test
# rocepool on rented AWS machines (tools/aws_cluster.py): create, run.sh on all
# of them, bring the reports back as this run's artifact, delete everything.
# Manual only (Actions > aws-test > Run workflow). Credentials: repository
# secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (an IAM user with EC2
# access, read access to SSM parameters and service quotas).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "efa = AWS's RDMA NIC (libfabric backend); rxe = Soft-RoCE (software RDMA, any type)"
        default: efa
        type: choice
        options: [efa, rxe]
      type:
        description: instance type
        default: c5n.9xlarge
      nodes:
        description: number of instances
        default: "2"
      region:
        description: "the account's projects may be limited to one region (us-east-2 for RoCEPool's)"
        default: us-east-2
      quick:
        description: 30 s IO500 only (skip the 300 s official run)
        default: false
        type: boolean
      max_hours:
        description: the instances delete themselves after this, whatever happens
        default: "5"
      probe_only:
        description: only find out what this account may do (no cost; nothing is created)
        default: false
        type: boolean
      budget_usd:
        description: refuse to start if nodes x price x max_hours exceeds this
        default: "30"
      request_vcpus:
        description: "ask AWS to raise the on-demand standard vCPU quota (L-1216C47A) in the region to this; empty = don't"
        default: ""
permissions:
  contents: write   # the reports go to a branch aws-results/<run id> (artifacts are not readable through every client)
concurrency: aws-test
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ inputs.region }}
      RUN_ID: gh-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: credentials and the cost ceiling
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error title=no AWS credentials::add repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"; exit 1
          fi
          aws sts get-caller-identity --query Arn --output text
          # on-demand USD/hour in us-east-1 (approximate); unknown types: ask AWS's price list
          python3 - "${{ inputs.type }}" "${{ inputs.nodes }}" "${{ inputs.max_hours }}" "${{ inputs.budget_usd }}" <<'PY'
          import json, subprocess, sys
          t, n, h, budget = sys.argv[1], int(sys.argv[2]), float(sys.argv[3]), float(sys.argv[4])
          table = {"c5n.9xlarge": 1.944, "c5n.18xlarge": 3.888, "c6in.16xlarge": 3.629, "c6in.32xlarge": 7.258,
                   "c6in.4xlarge": 0.907, "c6in.8xlarge": 1.814, "c7gn.16xlarge": 3.994, "c6gn.16xlarge": 2.765,
                   "m5dn.24xlarge": 6.528}
          price = table.get(t)
          if price is None:
              try:
                  out = subprocess.run(["aws", "pricing", "get-products", "--region", "us-east-1", "--service-code", "AmazonEC2",
                                        "--filters", f"Type=TERM_MATCH,Field=instanceType,Value={t}",
                                        "Type=TERM_MATCH,Field=location,Value=US East (N. Virginia)",
                                        "Type=TERM_MATCH,Field=operatingSystem,Value=Linux",
                                        "Type=TERM_MATCH,Field=tenancy,Value=Shared",
                                        "Type=TERM_MATCH,Field=preInstalledSw,Value=NA",
                                        "Type=TERM_MATCH,Field=capacitystatus,Value=Used"],
                                       capture_output=True, text=True, timeout=60).stdout
                  p = json.loads(json.loads(out)["PriceList"][0])
                  price = float(next(iter(next(iter(p["terms"]["OnDemand"].values()))["priceDimensions"].values()))["pricePerUnit"]["USD"])
              except Exception:
                  print(f"::error title=unknown price::no price for {t}: add it to the table in aws-test.yml"); sys.exit(1)
          worst = n * price * h + n * 200 * 0.08 / 730 * h
          print(f"{n} x {t} at ${price}/h: ceiling ${worst:.2f} for {h} h (budget ${budget})")
          if worst > budget:
              print(f"::error title=over budget::{n} x {t} for {h} h may cost ${worst:.2f} > ${budget}"); sys.exit(1)
          print(f"::notice title=cost ceiling::{n} x {t}, at most ${worst:.2f} ({h} h self-delete)")
          PY
      - name: what this account may do (dry runs, nothing is created)
        run: |
          set +e +o pipefail   # every check runs and reports, denied or not
          t="${{ inputs.type }}"
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=default --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo none)
          ami=$(aws ssm get-parameter --name /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id --query Parameter.Value --output text 2>&1 | tail -1)
          allowed=""; denied=""
          check() {  # name, command...: allowed / denied (why) -- a DryRun success is "Request would have succeeded"
            local name="$1"; shift
            out=$("$@" 2>&1); rc=$?
            if [ $rc -eq 0 ] || echo "$out" | grep -q "DryRunOperation"; then allowed="$allowed%0A$name"
            else denied="$denied%0A$name -- $(echo "$out" | tr '\n' ' ' | sed 's/.*error occurred//' | cut -c1-260)"; fi
          }
          check "ssm get-parameter (Ubuntu AMI)" aws ssm get-parameter --name /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
          check "ec2 describe-regions" aws ec2 describe-regions
          check "ec2 describe-instances" aws ec2 describe-instances
          check "ec2 describe-instance-types" aws ec2 describe-instance-types --instance-types "$t"
          check "ec2 describe-instance-type-offerings" aws ec2 describe-instance-type-offerings --filters Name=instance-type,Values="$t"
          check "ec2 describe-vpcs" aws ec2 describe-vpcs
          check "ec2 create-key-pair (dry run)" aws ec2 create-key-pair --key-name rp-probe --dry-run
          check "ec2 create-security-group (dry run)" aws ec2 create-security-group --group-name rp-probe --description probe --dry-run
          check "ec2 create-placement-group (dry run)" aws ec2 create-placement-group --group-name rp-probe --strategy cluster --dry-run
          check "service-quotas (vCPU quota)" aws service-quotas get-service-quota --service-code ec2 --quota-code L-1216C47A
          for it in "$t" c5n.18xlarge c6in.32xlarge c6in.4xlarge c5.4xlarge m5.large t3.micro; do
            check "ec2 run-instances $it (dry run)" aws ec2 run-instances --dry-run --image-id "$ami" --instance-type "$it" --count 1
          done
          q=$(aws service-quotas get-service-quota --service-code ec2 --quota-code L-1216C47A --query Quota.Value --output text 2>/dev/null || echo "?")
          pending=$(aws service-quotas list-requested-service-quota-change-history-by-quota --service-code ec2 --quota-code L-1216C47A \
                    --query 'RequestedQuotas[].[DesiredValue,Status,Created]' --output text 2>/dev/null | tr '\t\n' ' ;' | cut -c1-300)
          echo "::notice title=allowed::${allowed#%0A}"
          [ -n "$denied" ] && echo "::warning title=denied::${denied#%0A}"
          echo "::notice title=vCPU quota (on-demand standard)::$q in $AWS_DEFAULT_REGION; requests: ${pending:-none}"
      - name: request a vCPU quota increase
        if: ${{ inputs.request_vcpus != '' }}
        run: |
          rc=0
          out=$(aws service-quotas request-service-quota-increase --service-code ec2 --quota-code L-1216C47A \
                --desired-value "${{ inputs.request_vcpus }}" --query 'RequestedQuota.[Id,Status,DesiredValue]' --output text 2>&1) || rc=$?
          if [ $rc -eq 0 ]; then echo "::notice title=quota request::$out"
          else echo "::error title=quota request failed::$(echo "$out" | tr '\n' ' ' | cut -c1-500)"; exit 1; fi
      - name: run on AWS
        if: ${{ !inputs.probe_only }}
        run: |
          set -o pipefail
          rc=0
          python3 -u tools/aws_cluster.py run --run-id "$RUN_ID" --region "${{ inputs.region }}" \
            --mode "${{ inputs.mode }}" --type "${{ inputs.type }}" --nodes "${{ inputs.nodes }}" \
            --max-hours "${{ inputs.max_hours }}" ${{ inputs.quick && '--quick' || '' }} 2>&1 | tee aws_run.log || rc=$?
          # the progress lines and the outcome, as annotations (readable without the raw log)
          echo "::notice title=aws::$(grep -E '^\[aws ' aws_run.log | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          if [ $rc -ne 0 ]; then
            echo "::error title=aws_cluster failed::$(grep -vE '^\s*$' aws_run.log | tail -6 | tr '\n' ' ' | cut -c1-1500)"
          fi
          exit $rc
      - name: delete everything this run created
        if: always()
        run: |
          if [ -f "aws_runs/$RUN_ID/state.json" ]; then python3 tools/aws_cluster.py down --run-id "$RUN_ID" --region "${{ inputs.region }}"; fi
      - name: "reports to branch aws-results/<run id> (no SSH key, no file over 20 MB)"
        if: ${{ always() && !inputs.probe_only }}
        run: |
          d="aws_runs/$RUN_ID"; [ -d "$d" ] || exit 0
          out=$(mktemp -d); mkdir -p "$out/$RUN_ID"
          (cd "$d" && find . -type f ! -name ssh_key ! -name '*.pem' ! -name 'id_*' ! -name 'cluster.conf' -size -20M -print0 \
             | xargs -0 -I{} cp --parents {} "$out/$RUN_ID/")
          [ -f aws_run.log ] && cp aws_run.log "$out/$RUN_ID/"
          cd "$out" && git init -q && git checkout -q -b "aws-results/$RUN_ID" && git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "aws-test reports $RUN_ID"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "aws-results/$RUN_ID"
          echo "::notice title=reports::branch aws-results/$RUN_ID"
      - name: "reports (without the run SSH key: artifacts of a public repository are readable)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocepool-aws-${{ github.run_id }}
          path: |
            aws_runs/${{ env.RUN_ID }}/
            !aws_runs/${{ env.RUN_ID }}/ssh_key
            !aws_runs/${{ env.RUN_ID }}/**/*.pem
            !aws_runs/${{ env.RUN_ID }}/**/id_*
          if-no-files-found: warn
